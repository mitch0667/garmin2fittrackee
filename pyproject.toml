[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garmin2fittrackee"
version = "0.1.0"
description = "CLI tool to process Garmin data exports and push activities to FitTrackee"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15.0",
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "gpxpy>=1.6.0",
]

[project.scripts]
garmin2fittrackee = "garmin2fittrackee.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin2fittrackee"]
artifacts = ["src/garmin2fittrackee/equipment_mapping.toml", "src/garmin2fittrackee/activity_mapping.toml"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.11.0",
    "mypy>=1.15",
    "respx>=0.22.0",
]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
